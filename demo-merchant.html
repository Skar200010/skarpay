<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkarPay Demo Merchant</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f4f6f9; margin: 0; padding: 40px; }
    .card { background: #fff; border-radius: 12px; padding: 32px; max-width: 480px; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { margin: 0 0 8px; font-size: 22px; }
    .price { font-size: 32px; font-weight: 700; color: #528FF0; margin: 16px 0; }
    .pay-btn { background: #528FF0; color: #fff; border: none; padding: 14px 32px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; }
    .pay-btn:hover { background: #4070d0; }
    .pay-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    #status { margin-top: 20px; padding: 12px; border-radius: 8px; display: none; }
    .success { background: #ecfdf5; color: #065f46; display: block !important; }
    .failed { background: #fef2f2; color: #991b1b; display: block !important; }
    .info { background: #eff6ff; color: #1e40af; display: block !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛍️ Demo Store</h1>
    <p>Premium T-Shirt (Size M)</p>
    <div class="price">Rs. 1.00</div>
    <button class="pay-btn" data-skarpay-pay data-order-id="ORD-DEMO-1" data-amount="1" data-currency="INR" data-api-key="mk_live_4d9dc1f0ccc434eeb140d962e3700dec055616dda00cd20f">
      Pay Now with SkarPay
    </button>
    <div id="status"></div>
  </div>

  <script src="http://localhost:4100/sdk/skarpay.js" data-api-key="mk_live_4d9dc1f0ccc434eeb140d962e3700dec055616dda00cd20f"></script>
  <script>
    window.addEventListener('skarpay:payment:success', (e) => {
      const s = document.getElementById('status');
      s.className = 'success';
      s.textContent = '✅ Payment Successful! UTR: ' + (e.detail.utr || '—');
    });
    window.addEventListener('skarpay:payment:failed', (e) => {
      const s = document.getElementById('status');
      s.className = 'failed';
      s.textContent = '❌ Payment Failed';
    });
  </script>
</body>
</html>
