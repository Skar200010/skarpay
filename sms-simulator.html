<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Observer Simulator</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f4f6f9; margin: 0; padding: 40px; }
    .card { background: #fff; border-radius: 12px; padding: 32px; max-width: 560px; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { margin: 0 0 8px; font-size: 22px; }
    textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: monospace; resize: vertical; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
    .btn { background: #10b981; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 12px; }
    .btn:hover { background: #059669; }
    #result { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; }
    .success { background: #ecfdf5; color: #065f46; display: block !important; }
    .info { background: #eff6ff; color: #1e40af; display: block !important; }
    .failed { background: #fef2f2; color: #991b1b; display: block !important; }
    label { font-size: 13px; font-weight: 600; color: #374151; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 SMS Observer Simulator</h1>
    <p style="color: #6b7280; font-size: 14px; margin-bottom: 20px;">Paste your bank SMS here to auto-verify payment (simulates Android observer)</p>

    <label>VPA ID (receiving account ID)</label>
    <input id="acctId" placeholder="e.g. b68f2e46-2055-4bdf-91c6-a316cd40da63" />

    <label>Bank SMS text</label>
    <textarea id="smsText" placeholder="Rs.499.00 credited to A/c XX1234 on 27-10-26. UTR 987654321098. Ref ORD-1"></textarea>

    <button class="btn" onclick="sendObs()">Send Observation (Auto-Verify)</button>
    <div id="result"></div>
  </div>

  <script>
    const API = 'http://localhost:4100';
    async function sendObs() {
      const acctId = document.getElementById('acctId').value.trim();
      const text = document.getElementById('smsText').value.trim();
      const result = document.getElementById('result');
      if (!acctId || !text) { result.className = 'failed'; result.textContent = 'VPA ID and SMS text required'; return; }

      result.className = 'info';
      result.textContent = 'Sending...';

      try {
        const r = await fetch(API + '/api/v1/observers/sms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: 'SMS', rawText: text, receivingAccountId: acctId })
        });
        const j = await r.json();
        if (j.matched) {
          result.className = 'success';
          result.textContent = '✅ Auto-matched! Payment ' + j.sessionId + ' → SUCCESS';
        } else {
          result.className = 'info';
          result.textContent = '⏳ No matching payment found. Parsed: ' + JSON.stringify(j.parsed);
        }
      } catch (e) {
        result.className = 'failed';
        result.textContent = '❌ Error: ' + e.message;
      }
    }
  </script>
</body>
</html>
